<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Flores Amarillas 🌼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{overflow:hidden;background:linear-gradient(180deg,#0a0a2e 0%,#1a0a3e 50%,#2d0a4e 100%);font-family:'Georgia',serif;height:100vh}
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
#moon{position:fixed;top:6%;right:10%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffde7,#cfd8dc);box-shadow:0 0 40px 15px rgba(255,255,224,.3);z-index:1}
#flower-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:hidden}
.flower-fall{position:absolute;top:-70px;animation:fallFlower var(--dur) linear infinite;text-shadow:0 0 15px var(--c),0 0 30px var(--c);opacity:0}
@keyframes fallFlower{0%{transform:translateY(-70px) rotate(0deg);opacity:0}5%{opacity:.95}95%{opacity:.95}100%{transform:translateY(115vh) rotate(360deg);opacity:0}}
#title{position:fixed;top:6%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;text-align:center;color:#ffd700;font-size:26px;font-weight:bold;letter-spacing:4px;text-shadow:0 0 20px #ffd700,0 0 40px #ff8f00,0 0 60px #ff6f00;animation:pulseText 3s ease-in-out infinite}
#subtitle{position:fixed;top:12%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;color:rgba(255,215,0,.7);font-size:15px;letter-spacing:2px;text-shadow:0 0 10px #ffd700;white-space:nowrap}
@keyframes pulseText{0%,100%{opacity:.7}50%{opacity:1}}
#phrases{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:hidden}
.phrase{position:absolute;font-size:var(--fs);color:var(--c);font-weight:bold;text-shadow:0 0 12px var(--c),0 0 25px var(--c);animation:phraseFloat var(--dur) linear infinite;opacity:0;white-space:nowrap}
@keyframes phraseFloat{0%{transform:translateY(110vh) rotate(-3deg);opacity:0}8%{opacity:.9}92%{opacity:.9}100%{transform:translateY(-10vh) rotate(3deg);opacity:0}}
#hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:hidden}
.heart{position:absolute;animation:heartRise var(--dur) linear infinite;opacity:0;font-size:var(--sz)}
@keyframes heartRise{0%{transform:translateY(110vh) scale(.5);opacity:0}8%{opacity:.8}92%{opacity:.8}100%{transform:translateY(-10vh) scale(1.2);opacity:0}}
#bottom-text{position:fixed;bottom:8%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;color:rgba(255,255,255,.6);font-size:13px;letter-spacing:1px;text-align:center;text-shadow:0 0 10px rgba(255,215,0,.4);white-space:nowrap}
#btn-music{position:fixed;bottom:20px;right:20px;z-index:20;width:52px;height:52px;border-radius:50%;border:2px solid #ffd700;background:rgba(255,215,0,.1);color:#ffd700;font-size:22px;cursor:pointer;box-shadow:0 0 20px rgba(255,215,0,.3);transition:all .3s}
#btn-music:hover{background:#ffd700;color:#000;box-shadow:0 0 30px rgba(255,215,0,.6)}
</style>
</head>
<body>
<div id="stars"></div>
<div id="moon"></div>
<div id="flower-overlay"></div>
<div id="phrases"></div>
<div id="hearts"></div>
<div id="title">🌼 Flores Amarillas 🌼</div>
<div id="subtitle">21 de Septiembre • Para ti 💛</div>
<div id="bottom-text">Que el 21 de septiembre te encuentre con flores amarillas y mucho amor 💛</div>
<button id="btn-music">🎵</button>

<script>
// Stars
var starsC=document.getElementById('stars');
for(var i=0;i<120;i++){
var s=document.createElement('div');s.className='star';
s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';
s.style.setProperty('--dur',(1+Math.random()*3)+'s');
starsC.appendChild(s);}

// Yellow flowers falling
var flowerOverlay=document.getElementById('flower-overlay');
var flowers=['🌼','🌻','🌸','💛','🌺','✨','🌷'];
var flowerColors=['#ffd700','#ffb300','#ffca28','#ffee58','#ffab00','#ffd54f'];
function addFlower(){
var el=document.createElement('div');el.className='flower-fall';
el.textContent=flowers[Math.floor(Math.random()*flowers.length)];
var c=flowerColors[Math.floor(Math.random()*flowerColors.length)];
el.style.setProperty('--c',c);
el.style.left=Math.random()*95+'%';
el.style.fontSize=(18+Math.random()*26)+'px';
el.style.setProperty('--dur',(6+Math.random()*10)+'s');
el.style.animationDelay=(-Math.random()*14)+'s';
flowerOverlay.appendChild(el);
if(flowerOverlay.children.length>40)flowerOverlay.removeChild(flowerOverlay.firstChild);}
for(var i=0;i<30;i++)addFlower();
setInterval(addFlower,500);

// Romantic phrases
var phrases=[
'Eres mi lugar favorito. ❤️',
'Contigo todo es bonito. ✨',
'Me haces feliz sin intentarlo. 🥰',
'Te quiero más de lo que digo. ❤️',
'Eres mi casualidad favorita. 🌹',
'Solo tú haces especial mi día. 💕',
'Mi corazón te eligió a ti. ❤️'
];
var emojis=['❤️','💛','💕','🌼','🌻','💜','✨','🥰','💖','🌹'];
var all=phrases.concat(emojis);
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var queue=shuffle(all);
var phraseColors=['#ffd700','#ffb300','#ffca28','#fff176','#ffab00','#ff8f00'];
var phraseC=document.getElementById('phrases');
function addPhrase(){
if(queue.length===0)queue=shuffle(all);
var text=queue.pop();
var el=document.createElement('div');el.className='phrase';
el.textContent=text;
var isEmoji=text.length<=2;
var c=phraseColors[Math.floor(Math.random()*phraseColors.length)];
el.style.setProperty('--c',c);
el.style.setProperty('--fs',isEmoji?(22+Math.random()*20)+'px':(14+Math.random()*7)+'px');
el.style.left=Math.random()*88+5+'%';
el.style.setProperty('--dur',(8+Math.random()*12)+'s');
el.style.animationDelay=(-Math.random()*10)+'s';
phraseC.appendChild(el);
if(phraseC.children.length>25)phraseC.removeChild(phraseC.firstChild);}
for(var i=0;i<22;i++)addPhrase();
setInterval(addPhrase,2000);

// Floating hearts
var heartsC=document.getElementById('hearts');
var heartEmojis=['❤️','💛','💕','💖','💗','💘','♥️'];
function addHeart(){
var el=document.createElement('div');el.className='heart';
el.textContent=heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
el.style.left=Math.random()*90+5+'%';
el.style.setProperty('--sz',(14+Math.random()*18)+'px');
el.style.setProperty('--dur',(6+Math.random()*8)+'s');
el.style.animationDelay=(-Math.random()*10)+'s';
heartsC.appendChild(el);
if(heartsC.children.length>20)heartsC.removeChild(heartsC.firstChild);}
for(var i=0;i<15;i++)addHeart();
setInterval(addHeart,1200);

// Romantic music (generated)
var ac=null,musicOn=false,schedulerId=null;
var chords=[[220,261.63,329.63],[174.61,220,261.63],[130.81,164.81,196],[146.83,174.61,220]];
var melody=[440,523.25,587.33,659.25,783.99,880,659.25,523.25];
var chordIdx=0,melodyIdx=0;
function initAudio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();}
function playNote(freq,dur,type,vol,delay){
if(!ac||!musicOn)return;
var t=ac.currentTime+(delay||0);
var o=ac.createOscillator();var g=ac.createGain();
o.type=type||'sine';o.frequency.value=freq;
g.gain.setValueAtTime(0,t);
g.gain.linearRampToValueAtTime(vol,t+.1);
g.gain.exponentialRampToValueAtTime(.001,t+dur);
o.connect(g);g.connect(ac.destination);
o.start(t);o.stop(t+dur);}
function playChord(freqs,dur){freqs.forEach(function(f,i){playNote(f,dur,'sine',.06,i*.05);playNote(f*2,dur*.7,'triangle',.02,i*.08);});}
function scheduler(){
if(!musicOn)return;
playChord(chords[chordIdx%chords.length],4);
if(chordIdx%2===0){var n=melody[melodyIdx%melody.length];playNote(n,2,'sine',.12);playNote(n/2,2.5,'sine',.04,.1);melodyIdx++;}
chordIdx++;}
document.getElementById('btn-music').addEventListener('click',function(){
initAudio();
if(ac.state==='suspended')ac.resume();
musicOn=!musicOn;
this.textContent=musicOn?'🔇':'🎵';
if(musicOn){schedulerId=setInterval(scheduler,4000);scheduler();}
else clearInterval(schedulerId);});

// Auto-start music on first touch
var started=false;
document.body.addEventListener('click',function(){
if(!started){started=true;musicOn=true;document.getElementById('btn-music').textContent='🔇';initAudio();schedulerId=setInterval(scheduler,4000);scheduler();}});
</script>
</body>
</html>
