<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Flores Amarillas 🌼 21 de Septiembre</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{overflow:hidden;background:#000;font-family:'Georgia',serif;height:100vh;width:100vw}
#video-bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
#video-bg.no-audio{display:none}
#fallback-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;display:none;background:linear-gradient(180deg,#0a0a2e,#1a0a3e 50%,#2d0a4e)}
#fallback-bg.show{display:block}
#moon{position:fixed;top:6%;right:10%;width:65px;height:65px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffde7,#cfd8dc);box-shadow:0 0 40px 15px rgba(255,255,224,.4);z-index:1;display:none}
#moon.show{display:block}
.sparkle{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
#flower-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:hidden}
.flower-fall{position:absolute;top:-70px;animation:fallFlower var(--dur) linear infinite;opacity:0;filter:drop-shadow(0 0 8px rgba(255,215,0,.7))}
@keyframes fallFlower{0%{transform:translateY(-70px) rotate(0deg) scale(.8);opacity:0}5%{opacity:.95}50%{transform:translateY(50vh) rotate(180deg) scale(1)}95%{opacity:.95}100%{transform:translateY(115vh) rotate(360deg) scale(.8);opacity:0}}
#title{position:fixed;top:5%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;text-align:center;color:#fff;font-size:28px;font-weight:bold;letter-spacing:3px;text-shadow:0 0 15px #ffd700,0 0 30px #ff8f00,0 0 50px #ff6f00;animation:pulseText 3s ease-in-out infinite}
#subtitle{position:fixed;top:11%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;color:#ffd700;font-size:15px;letter-spacing:2px;text-shadow:0 0 10px #ffd700;white-space:nowrap;animation:fadeIn 2s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(15px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pulseText{0%,100%{opacity:.7}50%{opacity:1}}
#phrases{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:hidden}
.phrase{position:absolute;font-size:var(--fs);color:var(--c);font-weight:bold;text-shadow:0 0 12px var(--c),0 0 25px var(--c),0 0 40px rgba(0,0,0,.8);animation:phraseFloat var(--dur) linear infinite;opacity:0;white-space:nowrap}
@keyframes phraseFloat{0%{transform:translateY(110vh) rotate(-3deg) scale(.9);opacity:0}8%{opacity:.95}50%{transform:translateY(50vh) rotate(0) scale(1)}92%{opacity:.95}100%{transform:translateY(-10vh) rotate(3deg) scale(.9);opacity:0}}
#hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:hidden}
.heart{position:absolute;animation:heartRise var(--dur) linear infinite;opacity:0;filter:drop-shadow(0 0 8px rgba(255,50,100,.6))}
@keyframes heartRise{0%{transform:translateY(110vh) scale(.5);opacity:0}8%{opacity:.85}92%{opacity:.85}100%{transform:translateY(-10vh) scale(1.2);opacity:0}}
#btn-music{position:fixed;bottom:20px;right:20px;z-index:20;width:54px;height:54px;border-radius:50%;border:2px solid #ffd700;background:rgba(0,0,0,.55);color:#ffd700;font-size:23px;cursor:pointer;box-shadow:0 0 20px rgba(255,215,0,.3);transition:all .3s}
#btn-music:hover{background:#ffd700;color:#000;box-shadow:0 0 30px rgba(255,215,0,.6)}
#btn-full{position:fixed;bottom:20px;left:20px;z-index:20;width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font-size:20px;cursor:pointer;transition:all .3s}
#btn-full:hover{background:#fff;color:#000}
#bottom-text{position:fixed;bottom:8%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;color:#fff;font-size:13.5px;letter-spacing:1px;text-align:center;text-shadow:0 0 10px rgba(0,0,0,.8),0 0 15px rgba(255,215,0,.5);white-space:nowrap;animation:fadeIn 3s ease forwards}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 1.5s ease}
#loading.hidden{opacity:0;pointer-events:none}
#loadText{color:#ffd700;font-size:20px;letter-spacing:3px;text-shadow:0 0 15px #ffd700;animation:pulseText 1.5s ease-in-out infinite}
</style>
</head>
<body>
<div id="loading"><div id="loadText">🌼 Flores Amarillas 🌼</div></div>
<video id="video-bg" src="flores.mp4" playsinline loop></video>
<div id="fallback-bg"></div>
<div id="moon"></div>
<div id="flower-overlay"></div>
<div id="hearts"></div>
<div id="phrases"></div>
<div id="title">🌼 Flores Amarillas 🌼</div>
<div id="subtitle">21 de Septiembre • Para ti 💛</div>
<div id="bottom-text">Que el 21 de septiembre te encuentre con flores amarillas y mucho amor 💛</div>
<button id="btn-music">🔇</button>
<button id="btn-full">⛶</button>

<script>
var video=document.getElementById('video-bg');

// Hide loading then start
setTimeout(function(){document.getElementById('loading').classList.add('hidden');},1200);

// Try to play with audio; if blocked, use silent video + generated music
function tryPlay(){
video.muted=false;
video.play().then(function(){
// Audio working! Use video sound
stopGenerated();
}).catch(function(){
// Audio blocked - use fallback
video.muted=true;
video.play().catch(function(){document.getElementById('fallback-bg').classList.add('show');document.getElementById('moon').classList.add('show');});
startGenerated();});
}

var userTouched=false;
function firstInteraction(){
if(userTouched)return;
userTouched=true;
tryPlay();}

document.body.addEventListener('click',firstInteraction);
document.body.addEventListener('touchstart',firstInteraction,{passive:true});
tryPlay();

// Fullscreen
document.getElementById('btn-full').addEventListener('click',function(){
if(!document.fullscreenElement)document.documentElement.requestFullscreen();
else document.exitFullscreen();});

// Yellow flowers falling over the video
var flowerOverlay=document.getElementById('flower-overlay');
var flowers=['🌼','🌻','🌸','💛','🌺','✨','🌷','🪻','💐'];
var flowerColors=['#ffd700','#ffb300','#ffca28','#ffee58','#ffab00','#ffd54f','#fff176'];
function addFlower(){
var el=document.createElement('div');el.className='flower-fall';
el.textContent=flowers[Math.floor(Math.random()*flowers.length)];
var c=flowerColors[Math.floor(Math.random()*flowerColors.length)];
el.style.color=c;
el.style.setProperty('--dur',(6+Math.random()*10)+'s');
el.style.left=(Math.random()*93+1)+'%';
el.style.fontSize=(18+Math.random()*28)+'px';
el.style.animationDelay=(-Math.random()*14)+'s';
flowerOverlay.appendChild(el);
if(flowerOverlay.children.length>45)flowerOverlay.removeChild(flowerOverlay.firstChild);}
for(var i=0;i<35;i++)addFlower();
setInterval(addFlower,400);

// Hearts
var heartsC=document.getElementById('hearts');
var heartEmojis=['❤️','💛','💕','💖','💗','💘','♥️','💝'];
function addHeart(){
var el=document.createElement('div');el.className='heart';
el.textContent=heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
el.style.left=(Math.random()*90+5)+'%';
el.style.fontSize=(14+Math.random()*18)+'px';
el.style.setProperty('--dur',(6+Math.random()*8)+'s');
el.style.animationDelay=(-Math.random()*10)+'s';
heartsC.appendChild(el);
if(heartsC.children.length>25)heartsC.removeChild(heartsC.firstChild);}
for(var i=0;i<18;i++)addHeart();
setInterval(addHeart,900);

// Background sparkles
var bgS=document.getElementById('fallback-bg');
for(var i=0;i<90;i++){
var s=document.createElement('div');s.className='sparkle';
s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';
s.style.setProperty('--dur',(1+Math.random()*3)+'s');
bgS.appendChild(s);}

// Romantic phrases
var phrases=[
'Eres mi lugar favorito. ❤️',
'Contigo todo es bonito. ✨',
'Me haces feliz sin intentarlo. 🥰',
'Te quiero más de lo que digo. ❤️',
'Eres mi casualidad favorita. 🌹',
'Solo tú haces especial mi día. 💕',
'Mi corazón te eligió a ti. ❤️'
];
var emojis=['❤️','💛','💕','🌼','🌻','💜','✨','🥰','💖','🌹','💐','🪻'];
var all=phrases.concat(emojis);
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var queue=shuffle(all);
var phraseColors=['#ffd700','#ffb300','#ffca28','#fff176','#ffab00','#ff8f00','#ffe082'];
var phraseC=document.getElementById('phrases');
function addPhrase(){
if(queue.length===0)queue=shuffle(all);
var text=queue.pop();
var el=document.createElement('div');el.className='phrase';
el.textContent=text;
var isEmoji=text.length<=2;
var c=phraseColors[Math.floor(Math.random()*phraseColors.length)];
el.style.setProperty('--c',c);
el.style.setProperty('--fs',isEmoji?(22+Math.random()*20)+'px':(14+Math.random()*7)+'px');
el.style.left=(Math.random()*88+5)+'%';
el.style.setProperty('--dur',(8+Math.random()*12)+'s');
el.style.animationDelay=(-Math.random()*10)+'s';
phraseC.appendChild(el);
if(phraseC.children.length>25)phraseC.removeChild(phraseC.firstChild);}
for(var i=0;i<20;i++)addPhrase();
setInterval(addPhrase,1800);

// Generated romantic music (fallback when video audio blocked)
var ac=null,musicOn=false,schedulerId=null;
var chords=[[220,261.63,329.63],[174.61,220,261.63],[130.81,164.81,196],[146.83,174.61,220]];
var melody=[440,523.25,587.33,659.25,783.99,880,659.25,523.25];
var chordIdx=0,melodyIdx=0;
function initAudio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();}
function playNote(freq,dur,type,vol,delay){
if(!ac||!musicOn)return;
var t=ac.currentTime+(delay||0);
var o=ac.createOscillator();var g=ac.createGain();
o.type=type||'sine';o.frequency.value=freq;
g.gain.setValueAtTime(0,t);
g.gain.linearRampToValueAtTime(vol,t+.1);
g.gain.exponentialRampToValueAtTime(.001,t+dur);
o.connect(g);g.connect(ac.destination);
o.start(t);o.stop(t+dur);}
function playChord(freqs,dur){freqs.forEach(function(f,i){playNote(f,dur,'sine',.06,i*.05);playNote(f*2,dur*.7,'triangle',.02,i*.08);});}
function scheduler(){
if(!musicOn)return;
playChord(chords[chordIdx%chords.length],4);
if(chordIdx%2===0){var n=melody[melodyIdx%melody.length];playNote(n,2,'sine',.12);playNote(n/2,2.5,'sine',.04,.1);melodyIdx++;}
chordIdx++;}
function startGenerated(){if(!musicOn){musicOn=true;schedulerId=setInterval(scheduler,4000);scheduler();}}
function stopGenerated(){musicOn=false;if(schedulerId){clearInterval(schedulerId);schedulerId=null;}}

// Music button toggles video sound OR generated music
var audioMode='auto';
document.getElementById('btn-music').addEventListener('click',function(){
if(audioMode==='video'){
video.pause();audioMode='generated';this.textContent='🎵';
initAudio();startGenerated();
}else{
video.play();audioMode='video';this.textContent='🔇';
stopGenerated();}});
</script>
</body>
</html>
