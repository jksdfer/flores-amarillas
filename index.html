<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Flores Amarillas 🌼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{overflow:hidden;background:linear-gradient(180deg,#0a0a2e 0%,#1a0a3e 50%,#2d0a4e 100%);font-family:'Georgia',serif;height:100vh;width:100vw}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;background:#ffd700;border-radius:50%;animation:drift var(--dur) linear infinite;opacity:0}
@keyframes drift{0%{transform:translateY(105vh) translateX(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-5vh) translateX(40px);opacity:0}}
#flower-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:hidden}
.flower-fall{position:absolute;top:-90px;animation:fallFlower var(--dur) linear infinite;opacity:0;filter:drop-shadow(0 0 10px rgba(255,215,0,.8))}
.flower-fall img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes fallFlower{0%{transform:translateY(-80px) rotate(0deg) scale(.7);opacity:0}5%{opacity:.95}50%{transform:translateY(50vh) rotate(180deg) scale(1.05)}95%{opacity:.95}100%{transform:translateY(115vh) rotate(360deg) scale(.8);opacity:0}}
#hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:hidden}
.heart{position:absolute;animation:heartRise var(--dur) linear infinite;opacity:0;filter:drop-shadow(0 0 8px rgba(255,50,100,.6))}
@keyframes heartRise{0%{transform:translateY(110vh) scale(.5);opacity:0}10%{opacity:.85}90%{opacity:.85}100%{transform:translateY(-10vh) scale(1.2);opacity:0}}
#title{position:fixed;top:4%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;text-align:center;color:#fff;font-size:30px;font-weight:bold;letter-spacing:3px;text-shadow:0 0 20px #ffd700,0 0 40px #ff8f00,0 0 60px #ff6f00;animation:pulseText 3s ease-in-out infinite}
#subtitle{position:fixed;top:10%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;color:#ffd700;font-size:16px;letter-spacing:2px;text-shadow:0 0 10px #ffd700;white-space:nowrap;animation:fadeIn 2s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(15px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pulseText{0%,100%{opacity:.7}50%{opacity:1}}
#bottom-text{position:fixed;bottom:7%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;color:#fff;font-size:14px;letter-spacing:1px;text-align:center;text-shadow:0 0 10px rgba(0,0,0,.8),0 0 15px rgba(255,215,0,.5);white-space:nowrap;animation:fadeIn 3s ease forwards}
#btn-music{position:fixed;bottom:20px;right:20px;z-index:20;width:54px;height:54px;border-radius:50%;border:2px solid #ffd700;background:rgba(0,0,0,.55);color:#ffd700;font-size:23px;cursor:pointer;box-shadow:0 0 20px rgba(255,215,0,.3);transition:all .3s}
#btn-music:hover{background:#ffd700;color:#000}
#btn-full{position:fixed;bottom:20px;left:20px;z-index:20;width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font-size:20px;cursor:pointer;transition:all .3s}
#btn-full:hover{background:#fff;color:#000}
</style>
</head>
<body>
<div id="particles"></div>
<div id="hearts"></div>
<div id="flower-overlay"></div>
<div id="title">🌼 Flores Amarillas 🌼</div>
<div id="subtitle">21 de Septiembre • Para ti 💛</div>
<div id="bottom-text">Que el 21 de septiembre te encuentre con flores amarillas y mucho amor 💛</div>
<button id="btn-music">🎵</button>
<button id="btn-full">⛶</button>

<script>
// Golden particles drifting up
var pC=document.getElementById('particles');
for(var i=0;i<60;i++){
var p=document.createElement('div');p.className='particle';
p.style.left=(Math.random()*98+1)+'%';
p.style.width=(2+Math.random()*3)+'px';p.style.height=p.style.width;
p.style.setProperty('--dur',(8+Math.random()*10)+'s');
p.style.animationDelay=(-Math.random()*12)+'s';
pC.appendChild(p);}

// REALISTIC yellow flowers falling (real photos)
var flowerOverlay=document.getElementById('flower-overlay');
var flowerImgs=['assets/flower-sun.png','assets/flower-dand.png','assets/flower-daisy.png','assets/flower-sun.png','assets/flower-daisy.png'];
flowerImgs.forEach(function(s){var im=new Image();im.src=s;});
var emojiFall=['🌼','🌻','✨'];
function addFlower(){
var el=document.createElement('div');el.className='flower-fall';
var size=(30+Math.random()*38)+'px';
el.style.width=size;el.style.height=size;
var img=document.createElement('img');
img.src=flowerImgs[Math.floor(Math.random()*flowerImgs.length)];
img.alt='🌼';img.draggable=false;
img.onerror=function(){el.textContent=emojiFall[Math.floor(Math.random()*emojiFall.length)];el.style.fontSize=size;el.style.color='#ffd700';};
el.appendChild(img);
el.style.setProperty('--dur',(7+Math.random()*9)+'s');
el.style.left=(Math.random()*92+1)+'%';
el.style.animationDelay=(-Math.random()*14)+'s';
var sat=(110+Math.random()*40).toFixed(0);
img.style.filter='saturate('+sat+'%) brightness('+(95+Math.random()*15).toFixed(0)+'%)';
flowerOverlay.appendChild(el);
if(flowerOverlay.children.length>40)flowerOverlay.removeChild(flowerOverlay.firstChild);}
for(var i=0;i<32;i++)addFlower();
setInterval(addFlower,450);

// Hearts
var heartsC=document.getElementById('hearts');
var heartEmojis=['❤️','💛','💕','💖','💗','💘','♥️','💝'];
function addHeart(){
var el=document.createElement('div');el.className='heart';
el.textContent=heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
el.style.left=(Math.random()*90+5)+'%';
el.style.fontSize=(14+Math.random()*18)+'px';
el.style.setProperty('--dur',(6+Math.random()*8)+'s');
el.style.animationDelay=(-Math.random()*10)+'s';
heartsC.appendChild(el);
if(heartsC.children.length>25)heartsC.removeChild(heartsC.firstChild);}
for(var i=0;i<18;i++)addHeart();
setInterval(addHeart,900);

// Fullscreen
document.getElementById('btn-full').addEventListener('click',function(){
if(!document.fullscreenElement)document.documentElement.requestFullscreen();
else document.exitFullscreen();});

// Romantic piano music
var ac=null,musicOn=false,schedulerId=null;
var chords=[[220,261.63,329.63],[174.61,220,261.63],[130.81,164.81,196],[146.83,174.61,220]];
var melody=[440,523.25,587.33,659.25,783.99,880,659.25,523.25];
var chordIdx=0,melodyIdx=0;
function initAudio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();}
function playNote(freq,dur,type,vol,delay){
if(!ac||!musicOn)return;
var t=ac.currentTime+(delay||0);
var o=ac.createOscillator();var g=ac.createGain();
o.type=type||'sine';o.frequency.value=freq;
g.gain.setValueAtTime(0,t);
g.gain.linearRampToValueAtTime(vol,t+.1);
g.gain.exponentialRampToValueAtTime(.001,t+dur);
o.connect(g);g.connect(ac.destination);
o.start(t);o.stop(t+dur);}
function playChord(freqs,dur){freqs.forEach(function(f,i){playNote(f,dur,'sine',.06,i*.05);playNote(f*2,dur*.7,'triangle',.02,i*.08);});}
function scheduler(){
if(!musicOn)return;
playChord(chords[chordIdx%chords.length],4);
if(chordIdx%2===0){var n=melody[melodyIdx%melody.length];playNote(n,2,'sine',.12);playNote(n/2,2.5,'sine',.04,.1);melodyIdx++;}
chordIdx++;}
document.getElementById('btn-music').addEventListener('click',function(e){
e.stopPropagation();initAudio();
if(ac.state==='suspended')ac.resume();
musicOn=!musicOn;
this.textContent=musicOn?'🔇':'🎵';
if(musicOn){schedulerId=setInterval(scheduler,4000);scheduler();}
else clearInterval(schedulerId);});

// Auto-start music on first touch
var started=false;
document.body.addEventListener('click',function(){
if(!started){started=true;musicOn=true;document.getElementById('btn-music').textContent='🔇';initAudio();schedulerId=setInterval(scheduler,4000);scheduler();}});
</script>
</body>
</html>
